blokli_url: https://blokli.prod.hoprnet.link # NOTE: change this value to the URL of your Blokli provider
db:
  data: /app/hoprd/data
strategy:
  on_fail_continue: true
  allow_recursive: true
  strategies:
    - !AutoRedeeming
      redeem_only_aggregated: false
      minimum_redeem_ticket_value: "1 wxHOPR"
    - !ClosureFinalizer
      max_closure_overdue: 300s
identity:
  file: "/app/hoprd/conf/hopr.id"
api:
  enable: true
  host:
    address: !IPv4 0.0.0.0
    port: 3001