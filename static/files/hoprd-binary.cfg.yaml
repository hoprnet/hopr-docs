blokli_url: https://blokli.rotsee.hoprnet.link
identity:
  file: "/app/hoprd/conf/hopr.id"
  password: '' # TODO: password to your ID file
db:
  data: /app/hoprd/data
api:
  enable: true
  host:
    address:
      IPv4: 0.0.0.0
    port: 3001
  auth: # TODO: fill in your API token
strategy:
  allow_recursive: false
  execution_interval: 15s
  strategies:
    - AutoRedeeming:
        minimum_redeem_ticket_value: "1 wxHOPR"
        redeem_all_on_close: true
        redeem_on_winning: true
    - ClosureFinalizer:
        max_closure_overdue: 5m
hopr:
  host:
    address:
      IPv4: 127.0.0.1 # NOTE: adapt this to reflect your public IP
    port: 9001 # NOTE: adapt this to reflect your public PORT - the value set in HOPRD_P2P_PORT
  safe_module:
    safe_address: # NOTE: fill in value
    module_address: # NOTE: fill in value
session_ip_forwarding:
  use_target_allow_list: false