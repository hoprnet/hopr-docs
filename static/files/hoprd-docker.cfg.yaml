---
blokli_url: https://blokli-piz-palu.prod.hoprnet.link
identity:
  file: /app/hoprd-db/hopr.id
  password: "<YOUR_IDENTITY_PASSWORD>" # NOTE: fill in value
db:
  data: /app/hoprd-db/data
api:
  enable: true
  auth:
    Token: "<YOUR_API_TOKEN>" # NOTE: fill in value, at least 8 characters. Never remove: without a token the API is open
  host:
    address:
      IPv4: 0.0.0.0
    port: 3001
hopr:
  host:
    address:
      IPv4: <YOUR_PUBLIC_IP> # NOTE: fill in your public IP address
    port: 9091 # NOTE: must match the -p 9091 lines in your Docker command
  safe_module:
    safe_address: "<SAFE_ADDRESS>" # NOTE: fill in value
    module_address: "<MODULE_ADDRESS>" # NOTE: fill in value
  network:
    pix:
      num_ssa_parts: 4096
      ssa_part_size: 64
      additional_shares: 20
      max_ssas_per_request: 3
    incoming_session_pix:
      enforce_pix: false
      max_ssa_delivery_time: 20s
      max_deposit_wait: 60s
      ssas_per_request: 1
strategy:
  allow_recursive: false
  execution_interval: 15s
  strategies:
    - ChannelLifecycle:
        population:
          min_open_channels: 10
          target_open_channels: 40
        eligibility:
          require_currently_connected: true
          min_peer_quality_score: 0.5
          peer_quality_weight: 0.6
          ticket_activity_weight: 0.4
          require_observed_since_start: true
          allowlist: ~
          blocklist: []
        funding:
          sizing_mode:
            probabilistic:
              success_probability: 0.99
          initial_capacity: "1 GiB"
          topup_capacity: "1 GiB"
          lower_capacity_threshold: "512 MiB"
        proactive_funding:
          enabled: true
          safety_margin: 1.5
          balance_drain_weight: 1.0
          ticket_index_drain_weight: 1.0
        closure:
          close_below_quality_score: 0.3
          close_when_drained_below: "0 wxHOPR"
          close_max_concurrent: 2
        finalizer:
          enabled: true
          finalize_max_concurrent: 30
        restart: {}
        concurrency:
          max_concurrent_actions: 30
        selector: default
    - AutoRedeeming:
        redeem_all_on_close: true
        minimum_redeem_ticket_value: "1 wei wxHOPR"
        redeem_on_winning: true
